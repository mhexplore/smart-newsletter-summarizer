# Weekly (or manual) newsletter generation via CrewAI.
# Docs: docs/operations/github-actions.md

name: Smart Newsletter

on:
  schedule:
    # Mondays 08:00 UTC — adjust cron to your timezone
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      topic:
        description: "Search topic or RSS feed URL"
        required: false
        default: "latest developments in AI agents"
      send_email:
        description: "Send newsletter via SMTP after generation"
        required: false
        type: boolean
        default: false

env:
  NEWSLETTER_TOPIC: ${{ github.event.inputs.topic || vars.NEWSLETTER_TOPIC || 'latest developments in AI agents' }}
  SEND_EMAIL: ${{ github.event.inputs.send_email == true && 'true' || vars.SEND_EMAIL || 'false' }}

jobs:
  generate-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Repository secrets → process environment (no .env file on the runner)
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify API secrets are set
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is empty. Add it under Settings → Secrets → Actions (exact name)."
            exit 1
          fi
          if [ -z "$TAVILY_API_KEY" ]; then
            echo "::error::TAVILY_API_KEY is empty. Add it under Settings → Secrets → Actions (exact name)."
            exit 1
          fi
          echo "OPENAI_API_KEY and TAVILY_API_KEY are set."

      - name: Run newsletter crew
        run: python scripts/run_scheduled.py

      - name: Upload newsletter artifacts
        uses: actions/upload-artifact@v6
        with:
          name: newsletter-${{ github.run_number }}
          path: |
            output/newsletter.md
            output/scout_report.md
            output/fact_check_report.md
          retention-days: 90

      - name: Summary
        run: |
          echo "## Newsletter run" >> $GITHUB_STEP_SUMMARY
          echo "- Topic: $NEWSLETTER_TOPIC" >> $GITHUB_STEP_SUMMARY
          echo "- Send email: $SEND_EMAIL" >> $GITHUB_STEP_SUMMARY
          if [ -f output/newsletter.md ]; then
            echo "### Preview (first 20 lines)" >> $GITHUB_STEP_SUMMARY
            head -n 20 output/newsletter.md >> $GITHUB_STEP_SUMMARY
          fi
